<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zorvian Connected Beta</title><style>body{margin:0;background:#080808;color:#eee;font:16px Arial,sans-serif}main{max-width:720px;margin:auto;padding:54px 24px}.brand{color:#e2c277;letter-spacing:.22em;font-weight:800}h1{font-size:42px}label{display:block;margin:18px 0 7px;color:#d7bd7d}input{width:100%;padding:12px;background:#121212;color:#fff;border:1px solid #4b3d20;border-radius:8px;box-sizing:border-box}.note{padding:16px;border-left:3px solid #c9a45c;background:#111;color:#bbb;margin:20px 0}button,a{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:8px;text-decoration:none}button{background:#c9a45c;border:0;font-weight:700}a{border:1px solid #c9a45c;color:#e2c277}.status{margin-top:18px;color:#ddd}</style></head><body><main><div class="brand">ZORVIAN</div><h1>Connect to Core</h1><div class="note">Controlled Beta. Sign in with an authorised Zorvian beta account. Your password is sent directly to Zorvian Core over HTTPS and is never stored by this page. The session token is kept only in this browser tab.</div><form id="f"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><label>MFA code (if enabled)</label><input id="otp" inputmode="numeric" maxlength="6"><button type="submit">Connect securely</button></form><div id="status" class="status"></div><a href="/beta/">Open Beta Hub</a><script>const f=document.getElementById('f'),s=document.getElementById('status');f.onsubmit=async e=>{e.preventDefault();s.textContent='Connecting…';const body={email:email.value,password:password.value};if(otp.value.trim())body.otp=otp.value.trim();try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Login failed');const token=d.token||d.access_token||d.session_token;if(!token)throw new Error('Core returned no session token');sessionStorage.setItem('zorvian_beta_token',token);password.value='';s.textContent='Connected to Zorvian Core. You can now open the Beta Hub.'}catch(err){sessionStorage.removeItem('zorvian_beta_token');s.textContent='Connection failed: '+err.message}};</script></main></body></html>
