<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zorvian Beta Feedback</title><style>body{margin:0;background:#080808;color:#eee;font:16px Arial,sans-serif}main{max-width:760px;margin:auto;padding:42px 24px}.brand{color:#e2c277;letter-spacing:.2em;font-weight:800}h1{font-size:42px}label{display:block;margin:18px 0 7px;color:#d7bd7d}input,select,textarea{width:100%;padding:12px;background:#121212;color:#fff;border:1px solid #4b3d20;border-radius:8px}textarea{min-height:100px}.note{padding:15px;border-left:3px solid #c9a45c;background:#111;margin:22px 0;color:#bbb}button{margin-top:22px;padding:13px 18px;background:#c9a45c;border:0;border-radius:8px;font-weight:700}</style></head><body><main><div class="brand">ZORVIAN</div><h1>Beta Test Scorecard</h1><div class="note">This controlled scorecard stores nothing remotely. Copy your completed answers into the agreed feedback channel. Never enter confidential or production data.</div><form onsubmit="event.preventDefault(); const d=new FormData(this); const out=[...d].map(([k,v])=>k+': '+v).join('\n'); navigator.clipboard?.writeText(out); document.getElementById('done').textContent='Feedback prepared and copied where browser permission allows.'"><label>Module</label><select name="Module"><option>AI Receptionist</option><option>ZAI Auto</option><option>FreshX</option><option>Contract & Tender Intelligence</option><option>Lead Intelligence</option><option>Document Studio</option><option>Business Control</option><option>Route Intelligence</option></select><label>Scenario</label><textarea name="Scenario"></textarea><label>Expected result</label><textarea name="Expected result"></textarea><label>Actual result</label><textarea name="Actual result"></textarea><label>Accuracy 1–5</label><input name="Accuracy" type="number" min="1" max="5" required><label>Usefulness 1–5</label><input name="Usefulness" type="number" min="1" max="5" required><label>Clarity 1–5</label><input name="Clarity" type="number" min="1" max="5" required><label>Speed 1–5</label><input name="Speed" type="number" min="1" max="5" required><label>Unsupported assumptions / errors</label><textarea name="Errors"></textarea><label>Missing features</label><textarea name="Missing features"></textarea><label>Would you use it?</label><select name="Would use"><option>Yes</option><option>Maybe</option><option>No</option></select><label>Would you pay for it?</label><select name="Would pay"><option>Yes</option><option>Maybe</option><option>No</option></select><label>Final comments</label><textarea name="Comments"></textarea><button type="submit">Prepare feedback</button><p id="done"></p></form></main></body></html>
