name = "zorvian-platform"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "zorvian-db"
database_id = "90a4c2dc-02e0-49bd-8ae1-525483043bca"
# Production only: Workers AI is intentionally NOT configured at the top level.
# This prevents local development from contacting Cloudflare Workers AI.
[env.production]
name = "zorvian-platform-production"
compatibility_date = "2026-08-01"

[env.production.assets]
directory = "./public"

[[env.production.d1_databases]]
binding = "DB"
database_name = "zorvian-db"
database_id = "90a4c2dc-02e0-49bd-8ae1-525483043bca"

[env.production.ai]
binding = "AI"
