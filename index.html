<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111820">

<style>
:root{
  --dark:#111820;
  --gold:#f2a61b;
  --bg:#e0e3e5;
  --card:#fff;
  --muted:#68747e;
  --line:#d7dce0;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--dark);
  font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

#root{min-height:100vh}

.app{
  width:min(100%,560px);
  margin:0 auto;
  min-height:100vh;
  background:#f4f5f6;
}

.top{
  min-height:62px;
  padding:12px 16px;
  background:var(--dark);
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.top b{
  display:block;
  font-size:18px;
}

.top small{
  display:block;
  font-size:9px;
  letter-spacing:.5px;
}

.gold{color:var(--gold)}

main{padding:16px}

.hero small{
  color:var(--muted);
}

.hero h1{
  margin:6px 0 16px;
  font-size:30px;
}

.ai{
  background:var(--dark);
  color:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
}

.ai .ey{
  color:var(--gold);
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
}

.ai h2{
  margin:6px 0;
  font-size:20px;
}

.ai p{
  margin:8px 0 16px;
  color:#d5dbe0;
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.tile{
  background:#fff;
  color:var(--dark);
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
  min-height:105px;
}

.tile:hover{
  border-color:var(--gold);
}

.tile .icon{
  font-size:20px;
  margin-bottom:10px;
}

.tile b{
  display:block;
  font-size:13px;
  margin-bottom:5px;
}

.tile span{
  display:block;
  color:var(--muted);
  font-size:10px;
  line-height:1.4;
}

.sec{
  margin:18px 0;
}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.head h3{
  margin:0;
  font-size:15px;
}

.head button{
  border:0;
  background:none;
  color:#a66d00;
  font-size:10px;
  font-weight:900;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
}

.metric{
  text-align:center;
  padding:14px 8px;
}

.metric b{
  display:block;
  font-size:22px;
}

.metric span{
  display:block;
  color:var(--muted);
  font-size:9px;
}

.list{
  padding:12px;
}

.lead{
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.lead:last-child{
  border-bottom:0;
}

.lead b{
  display:block;
  font-size:12px;
}

.lead span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.empty{
  color:var(--muted);
  font-size:11px;
  padding:10px;
}

.nav{
  position:sticky;
  bottom:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#fff;
  border-top:1px solid var(--line);
}

.nav button{
  border:0;
  background:#fff;
  padding:12px 4px;
  color:#5f6870;
  font-size:9px;
  font-weight:900;
}

.nav i{
  display:block;
  color:var(--gold);
  font-style:normal;
  font-size:20px;
  margin-bottom:3px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:1000;
  align-items:flex-end;
  justify-content:center;
}

.sheet{
  width:min(100%,560px);
  max-height:85vh;
  overflow:auto;
  background:#fff;
  border-radius:18px 18px 0 0;
  padding:18px;
}

.sh{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.sh h2{
  margin:0;
  font-size:20px;
}

.close{
  border:0;
  background:#eee;
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:22px;
}

.form{
  display:grid;
  gap:10px;
}

.form textarea,
.form input{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px;
}

.primary{
  border:0;
  border-radius:9px;
  background:var(--gold);
  color:#111;
  font-weight:900;
  padding:12px;
}

.result{
  background:#f4f5f6;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
  white-space:pre-wrap;
  font-size:12px;
  line-height:1.5;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginbox{
  width:min(100%,390px);
  background:#fff;
  border-radius:16px;
  padding:24px;
}

.loginbox h1{
  margin:0 0 5px;
}

.loginbox p{
  color:var(--muted);
  font-size:12px;
}

.loginbox input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid var(--line);
  border-radius:8px;
}

.error{
  color:#c62828;
  font-size:11px;
  margin-top:8px;
}
</style>
</head>

<body>
<div id="root"></div>

<script>
const root=document.getElementById('root');

const esc=x=>String(x??'').replace(/[&<>]/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;'
}[c]));

async function api(path,options={}){
  const response=await fetch(path,{
    credentials:'same-origin',
    ...options,
    headers:{
      'content-type':'application/json',
      ...(options.headers||{})
    }
  });

  const data=await response.json();

  if(!response.ok){
    throw new Error(data.error||'Request failed');
  }

  return data;
}

function login(){
  root.innerHTML=`
    <div class="login">
      <div class="loginbox">
        <h1>ZORVIAN <span class="gold">AI</span></h1>
        <p>Business control platform</p>

        <form id="loginForm">
          <input id="email" type="email" placeholder="Email" required>
          <input id="password" type="password" placeholder="Password" required>
          <button class="primary" type="submit">LOG IN</button>
          <div id="loginError" class="error"></div>
        </form>
      </div>
    </div>
  `;

  document.getElementById('loginForm').onsubmit=async e=>{
    e.preventDefault();

    const error=document.getElementById('loginError');
    error.textContent='';

    try{
      await api('/api/auth/login',{
        method:'POST',
        body:JSON.stringify({
          email:document.getElementById('email').value,
          password:document.getElementById('password').value
        })
      });

      boot();
    }catch(err){
      error.textContent=err.message;
    }
  };
}

async function boot(){
  try{
    const m=await api('/api/me');

    if(m.authenticated){
      dash(m);
    }else{
      login();
    }
  }catch(err){
    login();
  }
}

async function loadLeads(){
  try{
    const data=await api('/api/leads');
    const leads=data.leads||[];

    const newer=leads.filter(x=>x.status==='new');
    const urgent=leads.filter(x=>x.priority==='urgent');

    document.getElementById('nc').textContent=newer.length;
    document.getElementById('uc').textContent=urgent.length;
    document.getElementById('lc').textContent=leads.length;

    const list=document.getElementById('list');

    if(!leads.length){
      list.innerHTML='<div class="empty">No leads yet.</div>';
      return;
    }

    list.innerHTML=leads.slice(0,10).map(x=>`
      <div class="lead">
        <b>${esc(x.name||x.company||'New enquiry')}</b>
        <span>${esc(x.requirement||'No requirement provided')}</span>
        <span>${esc(x.email||'')} ${x.priority==='urgent'?'• URGENT':''}</span>
      </div>
    `).join('');

  }catch(err){
    const list=document.getElementById('list');
    if(list)list.innerHTML='<div class="empty">Unable to load leads.</div>';
  }
}

function dash(m){
  root.innerHTML=`
    <div class="app">

      <header class="top">
        <div>
          <b>ZORVIAN <span class="gold">AI</span></b>
          <small>CLIENT CONTROL</small>
        </div>

        <div style="text-align:right">
          <small>CLIENT</small>
          <b>${esc(m.tenant?.name||'Zorvian')}</b>
        </div>
      </header>

      <main>

        <section class="hero">
          <small>Business command centre</small>
          <h1>Good afternoon</h1>
        </section>

        <section class="ai">
          <div class="ey">ZORVIAN AI</div>
          <h2>Your AI business team.</h2>
          <p>
            Choose an AI service to handle customer enquiries,
            social media and everyday business work.
          </p>

          <div class="grid">

            <div class="tile" onclick="openAI('receptionist')">
              <div class="icon">✦</div>
              <b>AI Receptionist</b>
              <span>
                Answer customer enquiries and qualify new business.
              </span>
            </div>

            <div class="tile" onclick="openAI('social')">
              <div class="icon">◉</div>
              <b>AI Social Media</b>
              <span>
                Create social posts, campaigns and content ideas.
              </span>
            </div>

            <div class="tile" onclick="openAI('assistant')">
              <div class="icon">↗</div>
              <b>AI Business Assistant</b>
              <span>
                Ask Zorvian for help with everyday business tasks.
              </span>
            </div>

          </div>
        </section>

        <section class="sec">
          <div class="head">
            <h3>Business today</h3>
            <button onclick="loadLeads()">REFRESH</button>
          </div>

          <div class="metrics">
            <div class="card metric">
              <b id="nc">0</b>
              <span>new</span>
            </div>

            <div class="card metric">
              <b id="uc">0</b>
              <span>urgent</span>
            </div>

            <div class="card metric">
              <b id="lc">0</b>
              <span>leads</span>
            </div>
          </div>
        </section>

        <section class="sec">
          <div class="head">
            <h3>Quick actions</h3>
          </div>

          <div class="grid">

            <div class="tile" onclick="openAI('receptionist')">
              <div class="icon">✦</div>
              <b>AI Receptionist</b>
              <span>Qualify customer enquiries.</span>
            </div>

            <div class="tile" onclick="openAI('social')">
              <div class="icon">◉</div>
              <b>AI Social Media</b>
              <span>Create social content.</span>
            </div>

            <div class="tile" onclick="openAI('assistant')">
              <div class="icon">↗</div>
              <b>AI assistant</b>
              <span>Get business help.</span>
            </div>

            <div class="tile" onclick="loadLeads()">
              <div class="icon">◎</div>
              <b>Manage leads</b>
              <span>Review new business.</span>
            </div>

          </div>
        </section>

        <section class="sec">
          <div class="head">
            <h3>Recent enquiries</h3>
          </div>

          <div class="card list" id="list">
            <div class="empty">Loading...</div>
          </div>
        </section>

        <section class="sec">
          <div class="head">
            <h3>Connected website</h3>
          </div>

          <div class="card list">
            <b>${esc(m.tenant?.website_url||'Not connected')}</b>
            <div class="empty">
              Zorvian provides the intelligence and control layer.
            </div>
          </div>
        </section>

      </main>

      <nav class="nav">
        <button onclick="window.scrollTo(0,0)">
          <i>⌂</i>HOME
        </button>

        <button onclick="loadLeads()">
          <i>◉</i>LEADS
        </button>

        <button onclick="openAI('assistant')">
          <i>✦</i>AI
        </button>

        <button onclick="logout()">
          <i>↪</i>LOG OUT
        </button>
      </nav>

    </div>

    <div class="modal" id="modal">
      <div class="sheet">

        <div class="sh">
          <h2 id="modalTitle">Zorvian AI</h2>
          <button class="close" onclick="closeAI()">×</button>
        </div>

        <div id="modalBody"></div>

      </div>
    </div>
  `;

  loadLeads();
}

function openAI(type){

  const modal=document.getElementById('modal');
  const title=document.getElementById('modalTitle');
  const body=document.getElementById('modalBody');

  const config={
    receptionist:{
      title:'AI Receptionist',
      placeholder:'Example: A customer wants to hire a 3-ton excavator next week...',
      prompt:'Qualify this customer enquiry. Ask for any important missing details such as service, location, timing and contact details.'
    },

    social:{
      title:'AI Social Media',
      placeholder:'Example: Create a Facebook post promoting our plant hire service...',
      prompt:'Create useful social media content for this business. Give the post copy and a short suggested call to action.'
    },

    assistant:{
      title:'AI Business Assistant',
      placeholder:'Example: Help me plan my customer follow-ups for this week...',
      prompt:'Help with this business request. Give a practical concise response and clearly identify any information that is missing.'
    }
  };

  const c=config[type]||config.assistant;

  title.textContent=c.title;

  body.innerHTML=`
    <div class="form">

      <textarea
        id="aiInput"
        rows="6"
        placeholder="${esc(c.placeholder)}"
      ></textarea>

      <button class="primary" onclick="askAI('${type}')">
        ASK ZORVIAN
      </button>

      <div id="aiResult"></div>

    </div>
  `;

  modal.style.display='flex';

  document.getElementById('aiInput').focus();
}

async function askAI(type){

  const input=document.getElementById('aiInput');
  const result=document.getElementById('aiResult');

  const q=input.value.trim();

  if(!q)return;

  result.innerHTML='<div class="result">Zorvian is thinking...</div>';

  try{

    const data=await api('/api/ai/enquiry',{
      method:'POST',
      body:JSON.stringify({
        message:q,
        type:type,
        page:location.href
      })
    });

    result.innerHTML=
      '<div class="result">'+esc(data.reply||'No response received.')+'</div>';

  }catch(err){

    result.innerHTML=
      '<div class="result">'+esc(err.message)+'</div>';

  }
}

function closeAI(){
  const modal=document.getElementById('modal');
  if(modal)modal.style.display='none';
}

async function logout(){

  try{
    await api('/api/auth/logout',{
      method:'POST',
      body:'{}'
    });
  }catch(e){}

  login();
}

boot();
</script>
</body>
</html>
