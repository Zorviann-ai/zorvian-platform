<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caelomere AI Secretary</title><style>body{font-family:Arial,sans-serif;margin:0;background:#0b1117;color:#f4f0e6}.wrap{max-width:900px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:900;letter-spacing:.16em}.brand span{color:#e5b84d}.back{color:#e5b84d;text-decoration:none}.panel{margin-top:28px;border:1px solid #2a3945;border-radius:14px;padding:22px;background:#101820}h1{margin:0 0 8px}p{color:#aab4bd;line-height:1.5}textarea{width:100%;min-height:180px;box-sizing:border-box;border:1px solid #344653;border-radius:10px;background:#0b1218;color:#fff;padding:14px;font-size:16px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#e5b84d;color:#111}.secondary{background:#1a2630;color:#fff;border:1px solid #344653}.status{margin-top:14px;color:#aab4bd}.result{margin-top:18px;white-space:pre-wrap;line-height:1.55;border-top:1px solid #263440;padding-top:18px}.meta{margin-top:10px;font-size:12px;color:#7f8c96}.error{color:#ff8d8d}.ok{color:#72d99f}@media(max-width:640px){.wrap{padding:18px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div class="brand">CAELOMERE <span>AI SECRETARY</span></div><a class="back" href="/core.html">BACK TO CORE</a></div><section class="panel"><h1>AI Secretary</h1><p>Type or dictate what you need. The secretary will prepare the work using Caelomere Celestial Core. External actions are not claimed as completed unless a connected provider confirms them.</p><textarea id="instruction" placeholder="Example: Draft a professional reply to John confirming we received his documents and create a clear list of next actions."></textarea><div class="actions"><button class="primary" id="run">ASK SECRETARY</button><button class="secondary" id="dictate">START DICTATION</button><button class="secondary" id="clear">CLEAR</button></div><div id="status" class="status">Ready.</div><div id="result" class="result" hidden></div><div id="meta" class="meta"></div></section></main><script>(()=>{const q=id=>document.getElementById(id),instruction=q('instruction'),run=q('run'),dictate=q('dictate'),clear=q('clear'),status=q('status'),result=q('result'),meta=q('meta');let rec=null;async function ask(){const text=instruction.value.trim();if(!text){status.textContent='Enter an instruction first.';status.className='status error';return}run.disabled=true;status.textContent='Secretary is working…';status.className='status';result.hidden=true;meta.textContent='';try{const r=await fetch('/api/core/run',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({service:'secretary',instruction:text})});let data={};try{data=await r.json()}catch{}if(r.status===401){status.textContent='Your session has expired. Please sign in again.';status.className='status error';return}if(!r.ok)throw new Error(data.error||('Request failed '+r.status));result.textContent=data.result||'No response returned.';result.hidden=false;status.textContent='Secretary response received.';status.className='status ok';meta.textContent=`Status: ${data.status||'prepared'} · Approval required: ${data.approval_required?'Yes':'No'} · External actions executed: ${data.external_actions_executed?'Yes':'No'}`;}catch(e){status.textContent='Secretary failed: '+(e.message||'unknown error');status.className='status error';}finally{run.disabled=false}}run.addEventListener('click',ask);clear.addEventListener('click',()=>{instruction.value='';result.hidden=true;result.textContent='';meta.textContent='';status.textContent='Ready.';status.className='status'});const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){dictate.disabled=true;dictate.textContent='DICTATION NOT SUPPORTED IN THIS BROWSER'}else{rec=new SR();rec.lang='en-GB';rec.interimResults=true;rec.continuous=true;let finalText='';rec.onstart=()=>{finalText=instruction.value.trim();status.textContent='Listening…';dictate.textContent='STOP DICTATION'};rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=(finalText?' ':'')+t;else interim+=t}instruction.value=(finalText+(interim?' '+interim:'')).trim()};rec.onend=()=>{dictate.textContent='START DICTATION';status.textContent='Dictation stopped.'};dictate.addEventListener('click',()=>{if(dictate.textContent.startsWith('STOP'))rec.stop();else rec.start()})}})();</script></body></html>
