<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111820"><title>Zorvian Business AI</title><style>
:root{--i:#111820;--o:#f2a61b;--b:#f4f5f6;--m:#6d7780;--l:#e0e3e5}*{box-sizing:border-box}body{margin:0;background:#dfe3e6;font-family:Arial,sans-serif;color:var(--i)}button,input,textarea{font:inherit}.app{min-height:100vh;width:min(480px,100%);margin:auto;background:var(--b);padding-bottom:75px}.top{background:var(--i);color:#fff;padding:15px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.top b{font-size:17px}.top small{display:block;font-size:9px;color:#cbd3d9}.gold{color:var(--o)}main{padding:15px}.hero small{color:var(--m)}.hero h1{font-size:28px;margin:5px 0 15px}.ai{background:linear-gradient(135deg,#111820,#293641);color:#fff;padding:15px;border-radius:15px}.ey{font-size:9px;color:var(--o);font-weight:900;letter-spacing:.13em}.ai h2{font-size:17px;margin:5px 0}.ai p{font-size:11px;color:#cbd3d9}.row{display:flex;gap:6px}.row input{flex:1;border:0;border-radius:8px;padding:11px}.btn{border:0;background:var(--o);font-weight:900;border-radius:8px;padding:10px 13px}.reply{display:none;background:#fff;color:#111;padding:10px;border-radius:8px;margin-top:8px;font-size:11px;line-height:1.5}.sec{margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.head h3{font-size:15px;margin:0}.head button{border:0;background:none;color:#986208;font-size:10px;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:#fff;border:1px solid var(--l);border-radius:11px;padding:13px}.metric{text-align:center}.metric b{font-size:21px}.metric span{display:block;color:var(--m);font-size:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#fff;border:1px solid var(--l);border-radius:11px;padding:14px;cursor:pointer}.tile b{display:block;font-size:12px;margin-top:7px}.tile span{display:block;color:var(--m);font-size:10px;margin-top:3px}.lead{display:grid;grid-template-columns:1fr auto;gap:7px;padding:10px 0;border-bottom:1px solid var(--l)}.lead:last-child{border:0}.lead b{font-size:12px}.lead small{display:block;color:var(--m);font-size:9px;margin-top:3px}.pill{font-size:8px;font-weight:900;padding:5px 7px;background:#eaf7ee;color:#168c45;border-radius:99px;height:max-content}.urgent{background:#fff0ed;color:#c33c32}.nav{position:fixed;bottom:0;width:min(480px,100%);height:68px;background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(4,1fr);z-index:6}.nav button{border:0;background:#fff;color:#68727a;font-size:9px;font-weight:900}.nav i{display:block;font-style:normal;font-size:20px;color:var(--o)}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.sheet{width:min(480px,100%);background:#fff;border-radius:17px 17px 0 0;padding:16px;max-height:90vh;overflow:auto}.sh{display:flex;justify-content:space-between}.close{border:0;border-radius:50%;width:30px;height:30px}.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:var(--i)}.box{background:#fff;width:min(390px,100%);padding:22px;border-radius:15px}.box input{width:100%;padding:11px;margin:5px 0 9px;border:1px solid var(--l)}.box button{width:100%;padding:12px;background:var(--o);border:0;font-weight:900}.err{color:#c33c32;font-size:10px;margin-top:8px}.log{background:#f5f6f6;padding:11px;border-radius:8px;font-size:10px;line-height:1.5}
</style></head><body><div id="root"></div><script>
const root=document.getElementById('root');const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(p,o={}){const r=await fetch(p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function boot(){const m=await api('/api/me');m.authenticated?dash(m):login()}function login(){root.innerHTML='<div class="login"><form class="box" onsubmit="doLogin(event)"><h1>ZORVIAN <span class="gold">AI</span></h1><p>Business control platform</p><input id="email" type="email" placeholder="Email" required><input id="pass" type="password" placeholder="Password" required><button>LOG IN</button><div class="err" id="err"></div><p><a href="#" onclick="reg()">Create first workspace</a></p></form></div>'}async function doLogin(e){e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});boot()}catch(x){err.textContent=x.message}}function reg(){root.innerHTML='<div class="login"><form class="box" onsubmit="doReg(event)"><h1>CREATE WORKSPACE</h1><input id="rn" placeholder="Your name" required><input id="biz" placeholder="Business name" required><input id="re" type="email" placeholder="Email" required><input id="rp" type="password" minlength="10" placeholder="Password (10+ chars)" required><input id="site" placeholder="Website URL"><button>CREATE</button><div class="err" id="reerr"></div></form></div>'}async function doReg(e){e.preventDefault();try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:rn.value,business:biz.value,email:re.value,password:rp.value,website_url:site.value})});boot()}catch(x){reerr.textContent=x.message}}
function dash(m){root.innerHTML=`<div class="app"><header class="top"><div><b>ZORVIAN <span class="gold">AI</span></b><small>CLIENT CONTROL</small></div><div style="text-align:right"><small>CLIENT</small><b>${esc(m.tenant?.name)}</b></div></header><main><div class="hero"><small>Business command centre</small><h1>Good afternoon</h1></div><section class="ai"><div class="ey">AI COMMAND</div><h2>Tell Zorvian what you want done.</h2><p>Website, leads, marketing and customer operations from one place.</p><div class="row"><input id="cmd" placeholder="Create a campaign for plant hire"><button class="btn" onclick="command()">RUN</button></div><div class="reply" id="reply"></div></section><section class="sec"><div class="head"><h3>Business today</h3><button onclick="leads()">REFRESH</button></div><div class="metrics"><div class="card metric"><b id="nc">—</b><span>new</span></div><div class="card metric"><b id="uc">—</b><span>urgent</span></div><div class="card metric"><b id="lc">—</b><span>leads</span></div></div></section><section class="sec"><div class="head"><h3>Quick actions</h3></div><div class="grid"><div class="tile" onclick="sheet('website')">✎<b>Edit website with AI</b><span>Prepare changes for approval.</span></div><div class="tile" onclick="sheet('leads')">◉<b>Manage leads</b><span>Review new business.</span></div><div class="tile" onclick="sheet('ai')">✦<b>AI assistant</b><span>Qualify enquiries.</span></div><div class="tile" onclick="sheet('campaign')">↗<b>Generate work</b><span>Create campaigns.</span></div></div></section><section class="sec"><div class="head"><h3>Recent enquiries</h3></div><div class="card" id="list"><div class="log">Loading…</div></div></section><section class="sec"><div class="head"><h3>Connected website</h3></div><div class="card"><b>${esc(m.tenant?.website_url||'Not connected')}</b><p style="font-size:10px;color:#6d7780">The public site remains yours; Zorvian is the intelligence and control layer.</p></div></section></main><nav class="nav"><button><i>⌂</i>HOME</button><button onclick="sheet('leads')"><i>◉</i>LEADS</button><button onclick="sheet('ai')"><i>✦</i>AI</button><button onclick="logout()"><i>↪</i>LOG OUT</button></nav></div><div class="modal" id="modal"><div class="sheet"><div class="sh"><h2 id="st"></h2><button class="close" onclick="closeSheet()">×</button></div><div id="sb"></div></div></div>`;leads()}
async function leads(){try{const d=await api('/api/leads'),a=d.leads||[];nc.textContent=a.filter(x=>x.status==='new').length;uc.textContent=a.filter(x=>x.priority==='urgent').length;lc.textContent=a.length;list.innerHTML=a.length?a.slice(0,12).map(x=>`<div class="lead"><div><b>${esc(x.company||x.name||'Enquiry')}</b><small>${esc(x.requirement||'No requirement')}</small></div><span class="pill ${x.priority==='urgent'?'urgent':''}">${esc(x.priority)}</span></div>`).join(''):'<div class="log">No leads yet.</div>'}catch(e){list.innerHTML='<div class="log">Could not load leads.</div>'}}
async function command(){const q=cmd.value.trim();if(!q)return;reply.style.display='block';reply.textContent='Zorvian is preparing the action…';try{const d=await api('/api/ai/command',{method:'POST',body:JSON.stringify({command:q})});reply.textContent=d.reply}catch(e){reply.textContent=e.message}}
function sheet(k){const v={website:['Website connection','<p>Zorvian enhances the existing client website rather than replacing it.</p><div class="log"><b>Flow</b><br>Existing website → AI assistant → secure lead record → client app.</div>'],leads:['Lead management','<p>Live leads are isolated to the authenticated client workspace.</p><button class="btn" onclick="leads();closeSheet()">REFRESH</button>'],ai:['AI assistant','<p>The client command centre uses the Zorvian AI endpoint. Production actions are only claimed after a connected system executes them.</p>'],campaign:['Generate work','<p>Describe the market and objective.</p><textarea id="cq" rows="5" style="width:100%;padding:10px;border:1px solid #ddd" placeholder="Target plant hire companies in Essex"></textarea><button class="btn" style="margin-top:8px" onclick="campaign()">PREPARE</button><div id="co"></div>']}[k];st.textContent=v[0];sb.innerHTML=v[1];modal.style.display='flex'}function closeSheet(){modal.style.display='none'}async function campaign(){try{const d=await api('/api/ai/command',{method:'POST',body:JSON.stringify({command:cq.value})});co.innerHTML='<div class="log" style="margin-top:8px"><b>Draft prepared</b><br>'+esc(d.reply)+'</div>'}catch(e){co.textContent=e.message}}async function logout(){await api('/api/auth/logout',{method:'POST'});boot()}boot();
</script></body></html>
