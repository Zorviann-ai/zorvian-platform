    <ellipse cx="166" cy="166" rx="126" ry="49" fill="none" stroke="url(#orbitB)" stroke-width="7" transform="rotate(55 166 166)" opacity=".86"/>
    <ellipse cx="166" cy="166" rx="106" ry="39" fill="none" stroke="#B47C21" stroke-width="5" transform="rotate(118 166 166)" opacity=".8"/>
    <circle cx="166" cy="166" r="53" fill="url(#core)" filter="url(#coreGlow)"/>
    <path d="M146 127C170 143 183 158 186 180C169 166 153 158 132 156C139 146 143 137 146 127Z" fill="#F7E6AA" opacity=".75"/>
    <circle cx="286" cy="98" r="8" fill="#F4D684"/><circle cx="52" cy="221" r="6" fill="#F5F0E7"/><circle cx="224" cy="286" r="5" fill="#B67518"/>
