<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Caelomere Celestial Core logo</title>
  <desc id="desc">A dynamic orbital gold and ivory core emblem with Caelomere Celestial Core wordmark on black.</desc>
  <defs>
    <radialGradient id="core" cx="42%" cy="35%" r="70%"><stop offset="0" stop-color="#FFF2B2"/><stop offset="0.26" stop-color="#E7B84B"/><stop offset="0.67" stop-color="#B67518"/><stop offset="1" stop-color="#4C2B05"/></radialGradient>
    <linearGradient id="orbitA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4D684"/><stop offset="1" stop-color="#8A5B16"/></linearGradient>
    <linearGradient id="orbitB" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#F5F0E7"/><stop offset="1" stop-color="#746443"/></linearGradient>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="420" rx="34" fill="#050505"/>
  <g transform="translate(58 44)">
