<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Caelomere</title><style>body{margin:0;background:#050505;color:#f4efe6;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);border:1px solid #765a18;border-radius:14px;padding:30px;background:#0b0b0b;box-sizing:border-box}h1{font-family:Georgia,serif;font-size:42px;line-height:1;margin:8px 0 16px}.label{color:#d6a82d;font-weight:800;letter-spacing:.12em;font-size:12px}p{color:#bdb4a7;line-height:1.5}label{display:block;margin:16px 0 8px;font-weight:700}input{width:100%;box-sizing:border-box;background:#050505;color:#fff;border:1px solid #4e4125;border-radius:8px;padding:13px;font-size:16px}button,.enter-core{margin-top:18px;width:100%;padding:14px;border:0;border-radius:8px;background:#d6a82d;color:#070707;font-weight:900;cursor:pointer;box-sizing:border-box;text-align:center;text-decoration:none;display:inline-block}.msg{margin-top:16px;padding:12px;border-radius:8px;display:none}.ok{background:#102010;color:#bce7bc}.err{background:#2a1010;color:#ffc0c0}.enter-core[hidden]{display:none}</style></head><body><main class="card"><div class="label">CAELOMERE SECURITY</div><h1>Reset your password.</h1><p>Choose a new password for your Caelomere account. Use at least 12 characters.</p><form id="form"><label>New password</label><input id="password" type="password" minlength="12" required autocomplete="new-password"><label>Confirm password</label><input id="confirm" type="password" minlength="12" required autocomplete="new-password"><button type="submit">RESET PASSWORD</button></form><div id="msg" class="msg"></div><a id="enterCore" class="enter-core" href="/" hidden>ENTER CELESTIAL CORE</a></main><script>const token=new URLSearchParams(location.search).get('token')||'';const form=document.getElementById('form'),msg=document.getElementById('msg'),enterCore=document.getElementById('enterCore');function show(text,ok=false){msg.textContent=text;msg.className='msg '+(ok?'ok':'err');msg.style.display='block'}if(!token){show('This reset link is missing or invalid. Request a new password reset.');form.style.display='none'}form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p!==c)return show('The passwords do not match.');if(p.length<12)return show('Use at least 12 characters.');try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:p})});const d=await r.json();if(!r.ok)return show(d.message||'The reset link is invalid or has expired.');show('Password updated successfully. Sign in with your new password to enter the Celestial Core.',true);form.style.display='none';enterCore.hidden=false;enterCore.focus()}catch{show('Unable to reset the password right now. Please try again.') }});</script></body></html>
