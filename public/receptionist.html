<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caelomere AI Receptionist</title><style>body{margin:0;font-family:Arial,sans-serif;background:#edf1f3;color:#17212b}.top{background:#111820;color:#fff;padding:18px 24px;font-weight:800}.wrap{max-width:1100px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #d9dee2;border-radius:14px;padding:18px}.avatar{height:260px;border-radius:14px;background:linear-gradient(160deg,#111820,#24303b);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}.face{width:120px;height:120px;border-radius:50%;border:3px solid #f2a61b;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:38px}.status{font-size:12px;font-weight:800;color:#68747e}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;color:#68747e;margin-bottom:5px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9dee2;border-radius:9px;font:inherit}.field textarea{min-height:140px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:900;background:#f2a61b;cursor:pointer;margin-right:7px}.secondary{background:#fff;border:1px solid #d9dee2}.result{white-space:pre-wrap;background:#f7f8f9;border:1px solid #d9dee2;border-radius:9px;padding:12px;min-height:120px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef1f3;font-size:11px;margin:3px}.ok{color:#238653}.bad{color:#b33b3b}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top">CAELOMERE AI RECEPTIONIST — Powered by Caelomere Celestial Core</div><div class="wrap"><div class="grid"><div class="card"><div class="avatar"><div><div class="face">AI</div><div id="listenState">READY TO LISTEN</div><div class="status" id="health">Checking service…</div></div></div><div class="field"><label>Caller phone number for CRM recognition test</label><input id="phone" placeholder="e.g. +44 7700 900123"></div><button class="btn" id="start">START SESSION</button><button class="btn secondary" id="lookup">LOOK UP CALLER</button><div id="caller" class="result" style="margin-top:12px">No caller checked yet.</div></div><div class="card"><div class="field"><label>Speak / Dictate / Type</label><textarea id="message" placeholder="Example: Add a note to John's account that he wants the quote by Friday and create a task to call him tomorrow morning."></textarea></div><button class="btn" id="send">SEND TO RECEPTIONIST</button><button class="btn secondary" id="clear">CLEAR</button><div style="margin:12px 0"><span class="pill" id="intent">Intent: —</span><span class="pill" id="urgency">Urgency: —</span></div><div id="reply" class="result">Start a session, then send a message.</div><h3>Proposed actions</h3><div id="actions" class="result">None yet.</div></div></div></div><script>const $=id=>document.getElementById(id);let sessionId='';async function api(path,opt={}){const r=await fetch(path,{credentials:'same-origin',headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/';throw new Error('Sign in required')}if(!r.ok)throw new Error(d.error||'Request failed');return d}async function health(){try{const d=await api('/api/receptionist/health');$('health').innerHTML=d.ai_ready?'<span class="ok">AI service ready</span>':'<span class="bad">AI binding unavailable</span>'}catch(e){$('health').innerHTML='<span class="bad">Service unavailable: '+e.message+'</span>'}}$('start').addEventListener('click',async()=>{try{const d=await api('/api/receptionist/sessions',{method:'POST',body:JSON.stringify({channel:'website',caller_phone:$('phone').value})});sessionId=d.id;$('caller').textContent=d.caller_recognised?`Recognised: ${d.contact.name}${d.contact.company?' — '+d.contact.company:''}\nSession: ${d.id}`:`Caller not matched in CRM.\nSession: ${d.id}`;$('listenState').textContent='SESSION ACTIVE'}catch(e){$('caller').textContent='ERROR: '+e.message}});$('lookup').addEventListener('click',async()=>{try{const d=await api('/api/receptionist/caller-lookup',{method:'POST',body:JSON.stringify({phone:$('phone').value})});$('caller').textContent=d.matched?`MATCHED CRM CONTACT\n${d.crm.contact.name}\n${d.crm.contact.company||''}\n${d.crm.contact.phone||''}\n\nOpen context loaded:\nTasks: ${d.crm.tasks.length}\nLeads: ${d.crm.leads.length}\nRecent activity: ${d.crm.activity.length}`:'No CRM contact matched that number.'}catch(e){$('caller').textContent='ERROR: '+e.message}});$('send').addEventListener('click',async()=>{if(!sessionId){$('reply').textContent='Start a session first.';return}const text=$('message').value.trim();if(!text)return;$('listenState').textContent='UNDERSTANDING…';$('reply').textContent='Thinking…';try{const d=await api(`/api/receptionist/sessions/${sessionId}/message`,{method:'POST',body:JSON.stringify({text})});$('reply').textContent=d.reply||'No reply returned.';$('intent').textContent='Intent: '+(d.intent||'—');$('urgency').textContent='Urgency: '+(d.urgency||'—');$('actions').textContent=(d.actions&&d.actions.length)?JSON.stringify(d.actions,null,2):'No actions proposed.';$('listenState').textContent='READY TO LISTEN'}catch(e){$('reply').textContent='ERROR: '+e.message;$('listenState').textContent='ERROR'}});$('clear').addEventListener('click',()=>{$('message').value='';$('reply').textContent='Ready.';$('actions').textContent='None yet.'});health();</script></body></html>
