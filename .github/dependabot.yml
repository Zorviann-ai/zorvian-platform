version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      cloudflare-toolchain:
        patterns:
          - wrangler
          - miniflare
          - workerd
          - '@cloudflare/*'
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - wrangler
          - miniflare
          - workerd
          - '@cloudflare/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
