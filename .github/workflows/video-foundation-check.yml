name: Zorvian Video foundation check

on:
  push:
    branches:
      - feature/zorvian-video-foundation
  pull_request:
    paths:
      - 'src/video/**'
      - 'src/video-entry.js'
      - 'public/video.html'
      - '0002_video_foundation.sql'
      - 'wrangler.toml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check src/video/core.js
          node --check src/video/api.js
          node --check src/video/providers/mock.js
          node --check src/video-entry.js
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Validate video migration SQL
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y sqlite3 >/dev/null
          sqlite3 /tmp/zorvian.db < 0001_initial.sql
          sqlite3 /tmp/zorvian.db < 0002_video_foundation.sql
          sqlite3 /tmp/zorvian.db '.schema video_projects'
