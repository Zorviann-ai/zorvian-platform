name: Zorvian Gate 5 Connected Beta Check

on:
  push:
    branches: [main, gate5-core-connected-beta]
    paths:
      - 'GATE5_CONNECTED_BETA.md'
      - 'intelligence/**'
      - 'tests/test_gate5_*.py'
      - '.github/workflows/gate5-connected.yml'
  pull_request:
    branches: [main]
    paths:
      - 'GATE5_CONNECTED_BETA.md'
      - 'intelligence/**'
      - 'tests/test_gate5_*.py'
      - '.github/workflows/gate5-connected.yml'

jobs:
  gate5-connected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile connected intelligence layer
        run: python -m py_compile intelligence/connected.py
      - name: Gate 5 connected intelligence tests
        run: python -m pytest -q tests/test_gate5_*.py
