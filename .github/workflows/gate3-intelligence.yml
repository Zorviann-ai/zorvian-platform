name: Zorvian Gate 3 Intelligence Check

on:
  push:
    branches: [main, gate3-intelligence-foundation]
    paths:
      - 'GATE3_INTELLIGENCE.md'
      - 'beta/**'
      - 'intelligence/**'
      - 'tests/test_gate3_*.py'
      - 'requirements-dev.txt'
      - '.github/workflows/gate3-intelligence.yml'
  pull_request:
    branches: [main]
    paths:
      - 'GATE3_INTELLIGENCE.md'
      - 'beta/**'
      - 'intelligence/**'
      - 'tests/test_gate3_*.py'
      - 'requirements-dev.txt'
      - '.github/workflows/gate3-intelligence.yml'

jobs:
  gate3-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile intelligence layer
        run: python -m py_compile intelligence/router.py intelligence/evaluation.py intelligence/context.py
      - name: Gate 3 intelligence acceptance tests
        run: python -m pytest -q tests/test_gate3_*.py
