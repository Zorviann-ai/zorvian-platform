name: Zorvian Guardian

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-tests:
    name: Generated security tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify committed dependency lockfile
        run: npm ci
      - name: Validate Guardian scripts
        run: |
          node --check scripts/guardian-generate.mjs
          node --check scripts/guardian-secrets.mjs
      - name: Scan repository for secrets
        run: npm run guardian:secrets
      - name: Generate repository-aware security tests
        run: npm run guardian:generate
      - name: Run generated security tests
        run: npm run guardian:test
      - name: Audit committed dependency state
        run: npm audit --audit-level=high

  lockfile-refresh-check:
    name: Verify safe Wrangler upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate candidate dependency state without committing
        run: npm install --package-lock-only --ignore-scripts --save-dev wrangler@4.123.0
      - name: Verify upgraded dependency state
        run: npm ci --ignore-scripts
      - name: Block high severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Upload reviewed candidate lockfile
        uses: actions/upload-artifact@v4
        with:
          name: guardian-package-lock-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  codeql:
    name: CodeQL security review
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: results
          upload: never
      - name: Retain CodeQL SARIF
        uses: actions/upload-artifact@v4
        with:
          name: guardian-codeql-sarif
          path: results/*.sarif
          if-no-files-found: error
          retention-days: 14
