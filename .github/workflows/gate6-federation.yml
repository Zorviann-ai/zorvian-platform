name: Zorvian Gate 6 Federation Check

on:
  push:
    branches: [main, gate6-live-intelligence-federation]
    paths:
      - 'intelligence/**'
      - 'tests/test_gate6_*.py'
      - 'GATE6_LIVE_INTELLIGENCE.md'
      - '.github/workflows/gate6-federation.yml'
  pull_request:
    branches: [main]

jobs:
  gate6-federation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile federation
        run: python -m py_compile intelligence/federation.py
      - name: Gate 6 federation tests
        run: python -m pytest -q tests/test_gate6_*.py
      - name: Gate 3 regression
        run: python -m pytest -q tests/test_gate3_*.py
      - name: Gate 5 regression
        run: python -m pytest -q tests/test_gate5_*.py
