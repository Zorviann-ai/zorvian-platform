name: Backend Dependency Remediation

on:
  push:
    branches:
      - audit/backend-final-checks

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/backend-final-checks
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update Wrangler dependency and lockfile
        run: npm install --save-dev --save-exact wrangler@4.123.0 --ignore-scripts
      - name: Verify high-severity dependency audit
        run: npm audit --audit-level=high
      - name: Commit dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Wrangler and clear dependency audit"
          git push origin HEAD:audit/backend-final-checks
